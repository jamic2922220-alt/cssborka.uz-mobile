name: X CLIENT iPhone (sinov - imzosiz IPA)
# 1-bosqich: dvijok (Xash3D FWGS, rasmiy iOS launcheri) + bizning CS client/menyu/server kutubxonalari iPhone uchun yig'iladimi.
# Imzo yo'q - telefonga o'rnatish uchun keyin Apple Developer sertifikati bilan imzolanadi (havola orqali o'rnatish).
on:
  push:
    branches: [claude/ios]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-26-intel   # arm Mac navbati to`lib qolyapti - iPhone uchun Intel Mac da ham yig`iladi
    steps:
      - name: Checkout Xash3D FWGS
        uses: actions/checkout@v5
        with:
          repository: FWGS/xash3d-fwgs
          submodules: recursive
      - name: Checkout X CLIENT o'yin kodi
        uses: actions/checkout@v5
        with:
          path: xcgame
          submodules: recursive
      - name: Dvijok bog'liqliklari (SDL3, openssl)
        run: |
          # rasmiy skript hlsdk ni ham oladi - bizga kerak emas, uni olib tashlaymiz
          sed -i '' '/hlsdk-portable/d' scripts/gha/deps_ios.sh
          bash scripts/gha/deps_ios.sh
          # Intel Mac da yig'ilganda opus x86 (SSE) kodini tanlab qo'yadi - iPhone uchun faqat umumiy kod
          sed -i '' "s/DEST_CPU.startswith('x86')/DEST_CPU.startswith('x86') and not conf.env.IOS/; s/bld.env.DEST_CPU.startswith('x86') and not conf.env.IOS/bld.env.DEST_CPU.startswith('x86') and not bld.env.IOS/" 3rdparty/opus/wscript
          grep -n "startswith('x86')" 3rdparty/opus/wscript
          python3 - <<'PY'
          p = 'wscript'; s = open(p).read()
          a = "\tif conf.env.DEST_CPU == 'amd64':"
          assert a in s
          s = s.replace(a, "\tif conf.env.IOS and not conf.options.IOSSIM:\n\t\tconf.env.DEST_CPU = 'aarch64'\n" + a, 1)
          open(p, 'w').write(s)
          PY
      - name: O'yin kutubxonalari (client, menyu, server) - iOS
        run: |
          mkdir -p build/ios/libs
          cmake -S xcgame -B gbuild -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_YY_THUNKS=OFF -DMAINUI_USE_STB=ON -DCMAKE_INSTALL_PREFIX=$(pwd)/build/ios/libs
          cmake --build gbuild --config Release -j 4
          cmake --install gbuild --config Release
          find build/ios/libs -type f | head -50
      - name: X CLIENT launcher (nom, bundle id, o'yin fayllarini yuklash, avtomatik boshlash)
        run: |
          cp xcgame/ios/XCSetup.inc ios/Launcher/XCSetup.inc
          python3 - <<'PY'
          p = 'ios/Launcher/AppDelegate.m'; s = open(p).read()
          a = 'NSString *libraryDirectory;'
          assert s.count(a) == 1 and s.count('[LibDownloader fetchManifest];') == 1
          s = s.replace(a, a + '\n#import "ViewController.h"\n#import "Game.h"\n#include "XCSetup.inc"\n', 1)
          s = s.replace('[LibDownloader fetchManifest];', 'XC_Start(self);   // X CLIENT: o\'yin fayllari + avtomatik boshlash', 1)
          open(p, 'w').write(s)
          p = 'ios/Launcher.xcodeproj/project.pbxproj'; s = open(p).read()
          for a, b in [('PRODUCT_BUNDLE_IDENTIFIER = su.xash.engine;', 'PRODUCT_BUNDLE_IDENTIFIER = uz.cssborka.xclient;'),
                       ('INFOPLIST_KEY_CFBundleDisplayName = "Xash3D FWGS";', 'INFOPLIST_KEY_CFBundleDisplayName = "X CLIENT";'),
                       ('MARKETING_VERSION = 1.0;', 'MARKETING_VERSION = 1.0.${{ github.run_number }};'),
                       ('CURRENT_PROJECT_VERSION = 1;', 'CURRENT_PROJECT_VERSION = ${{ github.run_number }};')]:
              assert a in s, a
              s = s.replace(a, b)
          open(p, 'w').write(s)
          PY
      - name: Launcher (imzosiz)
        run: |
          cp -vr /Library/Frameworks/SDL3.xcframework ./
          cd ios
          xcodebuild -scheme Launcher -target Launcher build -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS=""
          cd ..
          ls -la build
          mkdir -p artifacts && mv build/xash3d.ipa artifacts/X-CLIENT-ios-imzosiz.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: X-CLIENT-ios-imzosiz
          path: artifacts/
      - name: Release (imzosiz IPA - serverda imzolanadi)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ios-build-${{ github.run_number }} artifacts/X-CLIENT-ios-imzosiz.ipa -R ${{ github.repository }} \
            --target ${{ github.sha }} --prerelease --title "X CLIENT iPhone - build ${{ github.run_number }} (imzosiz)" \
            --notes "Imzosiz IPA. Serverda tools/ios_sign.sh bilan imzolanadi va mmb/mobile/X-CLIENT.ipa ga qo'yiladi. Versiya: 1.0.${{ github.run_number }}"
