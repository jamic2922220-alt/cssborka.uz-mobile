name: cssborka.uz Android APK (bitta APK, dvijok ichida)
on:
  push:
  workflow_dispatch:

jobs:
  # 1) Xash3D FWGS dvijogini rasmiy skriptlar bilan yig'ish
  engine:
    name: Xash3D dvijogi
    runs-on: ubuntu-latest
    env:
      SDL_VERSION: 2.32.10
      FFMPEG_VERSION: '9.0'
      GH_CPU_ARCH: multiarch
      GH_CPU_OS: android
    steps:
      - name: Checkout Xash3D FWGS
        uses: actions/checkout@v5
        with:
          repository: FWGS/xash3d-fwgs
          submodules: recursive
      - name: Install dependencies
        run: bash scripts/gha/deps_android.sh
      - name: Patch gyro (PRO - yumshoq va aniq)
        run: |
          python3 - <<'PY'
          p = 'engine/client/input/in_gyro.c'
          s = open(p, encoding='utf-8').read()
          def must(a, b):
              global s
              assert a in s, a
              s = s.replace(a, b, 1)
          must('static CVAR_DEFINE_AUTO( gyro_debug, "0", 0, "visualize built-in device gyroscope" );',
               'static CVAR_DEFINE_AUTO( gyro_debug, "0", 0, "visualize built-in device gyroscope" );\n'
               'static CVAR_DEFINE_AUTO( gyro_smooth, "0.5", FCVAR_ARCHIVE | FCVAR_FILTERABLE, "gyro smoothing 0..0.9 (removes hand shake)" );\n'
               'static CVAR_DEFINE_AUTO( gyro_soft, "1", FCVAR_ARCHIVE | FCVAR_FILTERABLE, "soft deadzone: tiny movements are damped, not cut" );\n'
               'static vec3_t gyro_filtered;')
          must('\tCvar_RegisterVariable( &gyro_debug );',
               '\tCvar_RegisterVariable( &gyro_debug );\n\tCvar_RegisterVariable( &gyro_smooth );\n\tCvar_RegisterVariable( &gyro_soft );')
          old_start = '\tif( fabs( mapped_speed[0] ) < gyro_pitch_deadzone.value )'
          old_end = '\t*dpitch -= gyro_pitch.value'
          i = s.index(old_start); j = s.index(old_end)
          s = s[:i] + (
              '\t{\n'
              '\t\tfloat a = bound( 0.0f, gyro_smooth.value, 0.9f );\n'
              '\t\tconst float dz[3] = { gyro_pitch_deadzone.value, gyro_yaw_deadzone.value, gyro_roll_deadzone.value };\n'
              '\t\tfor( int k = 0; k < 3; k++ )\n'
              '\t\t{\n'
              '\t\t\tgyro_filtered[k] = gyro_filtered[k] * a + mapped_speed[k] * ( 1.0f - a );\n'
              '\t\t\tfloat v = gyro_filtered[k];\n'
              '\t\t\tfloat av = fabs( v );\n'
              '\t\t\tif( gyro_soft.value && dz[k] > 0.0f )\n'
              '\t\t\t{\n'
              '\t\t\t\tif( av < dz[k] * 2.0f ) v *= av / ( dz[k] * 2.0f );\n'
              '\t\t\t}\n'
              '\t\t\telse if( av < dz[k] ) v = 0.0f;\n'
              '\t\t\tmapped_speed[k] = v;\n'
              '\t\t}\n'
              '\t}\n\n') + s[j:]
          open(p, 'w', encoding='utf-8').write(s)
          print('in_gyro.c patched')
          PY
      - name: Patch touch + avto qayta ulanish
        run: |
          python3 - <<'PY'
          p = 'engine/client/input/in_touch.c'
          s = open(p, encoding='utf-8').read()
          def must(a, b):
              global s
              assert s.count(a) == 1, ('not unique/missing', a[:80])
              s = s.replace(a, b, 1)
          must('static CVAR_DEFINE_AUTO( touch_precise_amount, "0.5", FCVAR_FILTERABLE, "sensitivity multiplier for precise-look" );',
               'static CVAR_DEFINE_AUTO( touch_precise_amount, "0.5", FCVAR_FILTERABLE, "sensitivity multiplier for precise-look" );\n'
               'static CVAR_DEFINE_AUTO( touch_aimfire, "1", FCVAR_ARCHIVE | FCVAR_FILTERABLE, "aim with the finger that holds +attack button" );')
          must('\tCvar_RegisterVariable( &touch_precise_amount );',
               '\tCvar_RegisterVariable( &touch_precise_amount );\n\tCvar_RegisterVariable( &touch_aimfire );')
          must('''				// increase precision
          				if( FBitSet( button->flags, TOUCH_FL_PRECISION ))
          					touch.precision = true;

          				result = true;
          			}
          			else if( button->type == touch_wheel )''',
          '''				// increase precision
          				if( FBitSet( button->flags, TOUCH_FL_PRECISION ))
          					touch.precision = true;

          				result = true;

          				// boost-top: otish tugmasini bosib turgan barmoq bilan nishonga olish
          				if( touch_aimfire.value && !Q_strncmp( button->command, "+attack", 7 ) && touch.move_finger != fingerID )
          				{
          					if( touch.look_finger == -1 )
          						touch.look_finger = fingerID;
          					return true; // ostidagi yurish zonasi bu barmoqni olib qo'ymasin
          				}
          			}
          			else if( button->type == touch_wheel )''')
          must('''				// disable precision mode
          				if( FBitSet( button->flags, TOUCH_FL_PRECISION ))
          					touch.precision = false;

          				result = true;
          			}
          			// handle wheel end''',
          '''				// disable precision mode
          				if( FBitSet( button->flags, TOUCH_FL_PRECISION ))
          					touch.precision = false;

          				// boost-top: otish tugmasi qo'yib yuborilsa nishon ham bo'shaydi
          				if( touch.look_finger == fingerID && !Q_strncmp( button->command, "+attack", 7 ))
          					touch.look_finger = -1;

          				result = true;
          			}
          			// handle wheel end''')

          # boost-top: yangi qulay tugma joylashuvi hamma o'yinchilarga bir marta qo'llanadi
          must('static CVAR_DEFINE_AUTO( touch_aimfire, "1", FCVAR_ARCHIVE | FCVAR_FILTERABLE, "aim with the finger that holds +attack button" );',
               'static CVAR_DEFINE_AUTO( touch_aimfire, "1", FCVAR_ARCHIVE | FCVAR_FILTERABLE, "aim with the finger that holds +attack button" );\n'
               'static CVAR_DEFINE_AUTO( bt_touch_layout, "0", FCVAR_ARCHIVE | FCVAR_PRIVILEGED, "boost-top touch layout version" );')
          must('\tCvar_RegisterVariable( &touch_aimfire );',
               '\tCvar_RegisterVariable( &touch_aimfire );\n\tCvar_RegisterVariable( &bt_touch_layout );')
          must("""	if( FS_FileExists( touch_config_file.string, true ) )
          	{
          		Cbuf_AddTextf( "exec \\"%s\\"\\n", touch_config_file.string );
          		Cbuf_Execute();
          	}
          	else Touch_LoadDefaults_f();
          """, """	qboolean bt_new = bt_touch_layout.value < 3 && FS_FileExists( "touch_presets/boosttop_pro.cfg", false );
          	if( bt_new )
          	{
          		Cbuf_AddText( "exec \\"touch_presets/boosttop_pro.cfg\\"\\n" );
          		Cbuf_Execute();
          		Cvar_DirectSet( &bt_touch_layout, "3" );
          	}
          	else if( FS_FileExists( touch_config_file.string, true ) )
          	{
          		Cbuf_AddTextf( "exec \\"%s\\"\\n", touch_config_file.string );
          		Cbuf_Execute();
          	}
          	else Touch_LoadDefaults_f();
          """)
          must("""	touch.configchanged = false;
          	touch.config_loaded = true;
          }""", """	touch.configchanged = bt_new; // yangi joylashuv faylga saqlansin
          	touch.config_loaded = true;
          }""")
          open(p, 'w', encoding='utf-8').write(s)
          print('in_touch.c patched (aim while firing + boosttop layout)')

          # boost-top: internet uzilib qolsa serverga o'zi qayta ulanadi
          p = 'engine/client/cl_main.c'
          s = open(p, encoding='utf-8').read()
          must('CVAR_DEFINE_AUTO( cl_timeout, "60", 0, "connect timeout (in-seconds)" );',
               'CVAR_DEFINE_AUTO( cl_timeout, "60", 0, "connect timeout (in-seconds)" );\n'
               'static CVAR_DEFINE_AUTO( cl_autoreconnect, "1", FCVAR_ARCHIVE, "reconnect automatically after connection timeout" );')
          must('\tCvar_RegisterVariable( &cl_timeout );',
               '\tCvar_RegisterVariable( &cl_timeout );\n\tCvar_RegisterVariable( &cl_autoreconnect );')
          must("""			Con_Printf( "\\nServer connection timed out.\\n" );
          			CL_Disconnect();
          			return;""", """			Con_Printf( "\\nServer connection timed out.\\n" );
          			CL_Disconnect();
          			if( cl_autoreconnect.value && !SV_Active( ))
          			{
          				Con_Printf( "Avto qayta ulanish...\\n" );
          				Cbuf_AddText( "retry\\n" );
          			}
          			return;""")
          open(p, 'w', encoding='utf-8').write(s)
          print('cl_main.c patched (auto reconnect)')
          PY
      - name: Build engine
        run: bash scripts/gha/build_android.sh
      - name: Collect engine parts
        run: |
          mkdir -p out/java/su/xash/engine/util
          cp artifacts/xash3d-fwgs-android.apk out/engine.apk
          cp -r 3rdparty/SDL/android-project/app/src/main/java/org out/java/
          cp android/app/src/main/java/su/xash/engine/XashActivity.java out/java/su/xash/engine/
          cp android/app/src/main/java/su/xash/engine/util/SoftKeyboardPan.java out/java/su/xash/engine/util/
          ls -la out
      - name: Upload engine parts
        uses: actions/upload-artifact@v4
        with:
          name: engine-parts
          path: out/

  # 2) CS16Client + bosh ekran + dvijok = bitta APK
  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: engine
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Download engine parts
        uses: actions/download-artifact@v4
        with:
          name: engine-parts
          path: engine
      - name: Put engine inside the app
        run: |
          python3 - <<'PY'
          import os, re, shutil, zipfile
          app = 'android/app/src/main'
          z = zipfile.ZipFile('engine/engine.apk')
          skip = re.compile(r'(menu|client|server|hl|yapb|dlls|^libcs)', re.I)
          for n in z.namelist():
              if n.startswith('lib/') and n.endswith('.so'):
                  _, abi, name = n.split('/', 2)
                  if skip.search(name):
                      print('skip lib', abi, name); continue
                  dst = os.path.join(app, 'jniLibs', abi, name)
                  os.makedirs(os.path.dirname(dst), exist_ok=True)
                  open(dst, 'wb').write(z.read(n)); print('lib', abi, name)
              elif n.startswith('assets/') and not n.endswith('/'):
                  dst = os.path.join(app, 'engine_assets', n[len('assets/'):])
                  os.makedirs(os.path.dirname(dst), exist_ok=True)
                  open(dst, 'wb').write(z.read(n)); print('asset', n)
          # dvijokning Java qismi (SDL + XashActivity)
          shutil.copytree('engine/java', os.path.join(app, 'java'), dirs_exist_ok=True)
          p = os.path.join(app, 'java/su/xash/engine/XashActivity.java')
          s = open(p, encoding='utf-8').read()
          s = s.replace('import su.xash.engine.util.CrashReports;', '')
          s = s.replace('CrashReports.STACKTRACE_NAME', '"stacktrace.txt"')
          s = s.replace('CrashReports.writeSystemInfo(this);', '')
          s = re.sub(r'CrashReports\.writeIntentInfo\([^;]*\);', '', s)
          assert 'CrashReports' not in s, 'CrashReports qoldi'
          open(p, 'w', encoding='utf-8').write(s)

          # boost-top: telefon uchun silliq boshqaruv va yengil grafika (har ishga tushganda)
          ud = os.path.join(app, 'engine_assets', 'userconfig.d')
          os.makedirs(ud, exist_ok=True)
          open(os.path.join(ud, 'zz_boosttop_mobile.cfg'), 'w', encoding='utf-8').write('\n'.join([
              '// boost-top: telefon uchun',
              'touch_aimfire "1"',
              'touch_nonlinear_look "1"',
              'touch_pow_factor "1.25"',
              'touch_pow_mult "300"',
              'touch_exp_mult "0"',
              'cl_weather "0"',
              'cl_gunsmoke "0"',
              'cl_shadows "0"',
              'cl_corpsestay "0"',
              'r_decals "100"',
              'mp_decals "50"',
              'cl_timeout "25"',
              'cl_autoreconnect "1"',
              'vibration_enable "1"',
              "// sezgirlik: Sekin / O'rtacha / Tez",
              'alias bt_sens_1 "touch_yaw 40; touch_pitch 32; gyro_yaw 0.9; gyro_pitch 0.75; echo Sezgirlik: SEKIN; alias bt_sens bt_sens_2"',
              'alias bt_sens_2 "touch_yaw 55; touch_pitch 45; gyro_yaw 1.2; gyro_pitch 1.0; echo Sezgirlik: ORTACHA; alias bt_sens bt_sens_3"',
              'alias bt_sens_3 "touch_yaw 75; touch_pitch 60; gyro_yaw 1.6; gyro_pitch 1.3; echo Sezgirlik: TEZ; alias bt_sens bt_sens_1"',
              'alias bt_sens "bt_sens_3"',
              '// batareya rejimi',
              'alias bt_batt_on "fps_max 60; echo Batareya rejimi: YONIQ (60 FPS); alias bt_batt bt_batt_off"',
              'alias bt_batt_off "fps_max 100; echo Batareya rejimi: OCHIQ; alias bt_batt bt_batt_on"',
              'alias bt_batt "bt_batt_on"',
          ]) + '\n')
          # ilova build raqami (avtomatik yangilanish uchun)
          os.makedirs(os.path.join(app, 'engine_assets'), exist_ok=True)
          open(os.path.join(app, 'engine_assets', 'bt_build.txt'), 'w').write(os.environ.get('GITHUB_RUN_NUMBER', '0'))

          # touch tugmalari rasmlari, menyu fayllari, bot sozlamalari -> APK ichiga (binafsha kvadratlar bo'lmasin)
          ea = os.path.join(app, 'engine_assets')
          for src in ['3rdparty/cs16client-extras', '3rdparty/yapb/cfg']:
              shutil.copytree(src, ea, dirs_exist_ok=True); print('extras', src)
          # Ekrandagi ⚙ (touch_edit) tugmasi tugma muharririni emas, o'yin menyusini ochsin
          n_edit = 0
          for root, _, files in os.walk(ea):
              for fn in files:
                  if not fn.endswith('.cfg'): continue
                  fp = os.path.join(root, fn)
                  t = open(fp, encoding='utf-8', errors='replace').read()
                  t2 = re.sub(r'^(\s*touch_addbutton\s+"[^"]*edit[^"]*"\s+"[^"]*"\s+)"[^"]*"',
                              r'\1"togglemenu"', t, flags=re.M | re.I)
                  if t2 != t:
                      open(fp, 'w', encoding='utf-8').write(t2); n_edit += 1; print('touch_edit ->', fp)
          print('touch cfg patched:', n_edit)
          # boost-top: qulay PRO tugma joylashuvi (dvijok uni hammaga bir marta qo'llaydi)
          os.makedirs(os.path.join(ea, 'touch_presets'), exist_ok=True)
          open(os.path.join(ea, 'touch_presets', 'boosttop_pro.cfg'), 'w', encoding='utf-8').write('\n'.join([
              "// boost-top PRO telefon tugmalari (oson o'ynash uchun)",
              'touch_config_file "touch_profiles/boosttop_pro.cfg"',
              'touch_forwardzone "0.110000"',
              'touch_sidezone "0.065000"',
              'touch_pitch "45.000000"',
              'touch_yaw "55.000000"',
              'touch_grid_count "50"',
              'touch_grid_enable "1"',
              'touch_set_stroke 1 255 59 59 200',
              'touch_highlight_r "1.000000"',
              'touch_highlight_g "0.300000"',
              'touch_highlight_b "0.300000"',
              'touch_highlight_a "1.000000"',
              'touch_dpad_radius "1.000000"',
              'touch_joy_radius "1.000000"',
              'touch_precise_amount "0.400000"',
              'touch_move_indicator "3"',
              'touch_setclientonly 0',
              '// sozlamalar (bir marta)',
              'touch_aimfire "1"',
              'gyro_enable "1"',
              'gyro_yaw "1.2"',
              'gyro_pitch "1.0"',
              'gyro_smooth "0.5"',
              'zoom_sensitivity_ratio "0.8"',
              'hud_centerid "1"',
              'cl_killsound "1"',
              'touch_removeall',
              "// yurish (chap yarmi, barmoq tekkan joyda joystik paydo bo'ladi) va nishon (o'ng yarmi)",
              'touch_addbutton "move" "" "_move" 0.000000 0.380000 0.480000 1.000000 255 255 255 150 0',
              'touch_addbutton "look" "" "_look" 0.480000 0.120000 1.000000 1.000000 255 255 255 150 0',
              "// otish: o'ngda katta, chapda kichik (ikkalasida ham barmoqni surib nishonga olinadi)",
              'touch_addbutton "attack" "touch/gfx/attack" "+attack" 0.770000 0.470000 0.910000 0.720000 255 255 255 170 0 1',
              'touch_addbutton "attack_l" "touch/gfx/attack" "+attack" 0.050000 0.200000 0.150000 0.380000 255 255 255 150 0 1',
              'touch_addbutton "attack2" "touch/gfx/attack2" "+attack2" 0.680000 0.300000 0.760000 0.440000 255 255 255 150 0 1',
              'touch_addbutton "reload" "touch/gfx/reload" "+reload" 0.790000 0.300000 0.860000 0.430000 255 255 255 150 0 1',
              'touch_addbutton "jump" "touch/gfx/jump" "+jump" 0.890000 0.200000 0.990000 0.380000 255 255 255 160 0 1',
              'touch_addbutton "duck" "touch/gfx/duck" "+duck" 0.900000 0.760000 0.990000 0.920000 255 255 255 160 512 1',
              'touch_addbutton "use" "touch/gfx/use" "+use" 0.900000 0.420000 0.980000 0.560000 255 255 255 140 0 1',
              'touch_addbutton "walk" "touch/gfx/walk" "+speed" 0.180000 0.220000 0.250000 0.350000 255 255 255 130 0 1',
              '// qurollar',
              'touch_addbutton "w1" "touch/gfx/w_rifle" "slot1" 0.300000 0.000000 0.360000 0.107000 255 255 255 150 0 1',
              'touch_addbutton "w2" "touch/gfx/w_pistol" "slot2" 0.370000 0.000000 0.430000 0.107000 255 255 255 150 0 1',
              'touch_addbutton "w3" "touch/gfx/w_knife" "slot3" 0.440000 0.000000 0.500000 0.107000 255 255 255 150 0 1',
              'touch_addbutton "w4" "touch/gfx/w_grenade" "slot4" 0.510000 0.000000 0.570000 0.107000 255 255 255 150 0 1',
              'touch_addbutton "drop" "touch/gfx/drop" "drop" 0.580000 0.000000 0.640000 0.107000 255 255 255 130 0 1',
              '// sotib olish: oddiy menyu va bir tegishda (AK/M4 + zirh + granata)',
              'touch_addbutton "buy" "touch/gfx/buy" "buy" 0.660000 0.000000 0.720000 0.107000 255 255 255 150 0 1',
              'touch_addbutton "qbuy" "touch/gfx/buy" "autobuy" 0.730000 0.000000 0.790000 0.107000 255 210 60 220 0 1',
              '// boshqa',
              'touch_addbutton "menu" "touch/gfx/settings" "togglemenu" 0.000000 0.000000 0.060000 0.107000 255 255 255 150 0 1',
              'touch_addbutton "score" "touch/gfx/score" "scoreboard" 0.070000 0.000000 0.130000 0.107000 255 255 255 150 0 1',
              'touch_addbutton "chat" "touch/gfx/chat_all" "messagemode" 0.140000 0.000000 0.200000 0.107000 255 255 255 130 0 1',
              'touch_addbutton "radio" "touch/gfx/radio" "showvguimenu 38" 0.210000 0.000000 0.270000 0.107000 255 255 255 130 0 1',
              '// sezgirlik va batareya',
              'touch_addbutton "sens" "touch/gfx/plus" "bt_sens" 0.800000 0.000000 0.860000 0.107000 255 255 255 150 0 1',
              'touch_addbutton "batt" "touch/gfx/light" "bt_batt" 0.865000 0.000000 0.925000 0.107000 255 255 255 150 0 1',
              'touch_addbutton "change_team" "touch/gfx/change_team" "chooseteam" 0.930000 0.000000 0.990000 0.107000 255 255 255 130 0 1',
          ]) + '\n')
          # boost-top: dushmanni o'ldirganda telefon yengil titraydi
          p = 'cl_dll/death.cpp'
          s = open(p, encoding='utf-8').read()
          a = '\t\tkiller_this_player = g_PlayerInfoList[killer].thisplayer;\n'
          if a in s:
              s = s.replace(a, a + '\t\tif( killer_this_player && killer != victim && g_iXash )\n\t\t\tgMobileAPI.pfnVibrate( 60.0f, 0 );\n', 1)
              open(p, 'w', encoding='utf-8').write(s); print('death.cpp: kill vibration')
          else:
              print('::warning::death.cpp topilmadi, titrash qo\'shilmadi')
          # CMake ham shu fayllarni src/main/assets ga ko'chiradi - takrorlanmasin, o'chiramiz
          p = 'CMakeLists.txt'
          s = open(p, encoding='utf-8').read()
          s2 = re.sub(r'file\(\s*REMOVE_RECURSE \$\{EXTRAS_OUTPUT\}\s*\)', '', s)
          s2 = re.sub(r'file\(\s*COPY \$\{EXTRAS_FILES\} \$\{YAPB_FILES\}\s*DESTINATION \$\{EXTRAS_OUTPUT\}\s*\)', '', s2)
          assert s2 != s, 'CMake extras copy topilmadi'
          open(p, 'w', encoding='utf-8').write(s2)

          # Menyu tugmalari rasm emas, matn bo'lsin (tanlangan tilda) - kompyuterdagidek
          p = '3rdparty/mainui_cpp/BaseMenu.cpp'
          s = open(p, encoding='utf-8').read()
          a = 'uiStatic.renderPicbuttonText = gMenu.m_gameinfo.flags & GFL_RENDER_PICBUTTON_TEXT;'
          assert a in s, a
          s = s.replace(a, 'uiStatic.renderPicbuttonText = true;')
          open(p, 'w', encoding='utf-8').write(s)
          print('BaseMenu.cpp: text buttons')
          # Bosh menyu: kompyuterdagi CS 1.6 kabi
          #   Возобновить / Отключиться / Случайный сервер / Новая игра / Найти серверы / Настройки / Выход
          p = '3rdparty/mainui_cpp/menus/Main.cpp'
          s = open(p, encoding='utf-8').read()
          def must(a, b, cnt=None):
              global s
              assert a in s, a
              s = s.replace(a, b) if cnt is None else s.replace(a, b, cnt)
          for item in ['previews', 'saveRestore', 'hazardCourse', 'customGame']:
              must('AddItem( %s );' % item, ';')
          # "View Readme" tugmasi -> "Случайный сервер" (ilova yozgan boosttop_random.cfg ni ishga tushiradi)
          s = re.sub(r'readme\.SetNameAndStatus\([^;]*\);',
              lambda m: '''{ const char *bt_l = EngFuncs::GetCvarString( "ui_language" ); const char *bt_rs = "Random server";
          		if( bt_l && !strcmp( bt_l, "russian" )) bt_rs = "Случайный сервер";
          		else if( bt_l && !strcmp( bt_l, "uzbek" )) bt_rs = "Tasodifiy server";
          		readme.SetNameAndStatus( bt_rs, NULL ); }
          	readme.onReleased.SetCommand( 0, "exec boosttop_random.cfg\\n" );''', s, count=1)
          must('readme.SetPicture( PC_VIEW_README );', '')
          # "Новая игра" -> server yaratish (botlar bilan), kompyuterdagidek
          must('newGame.onReleased = UI_NewGame_Menu;', 'newGame.onReleased = UI_CreateGame_Menu;')
          must('newGame.SetGrayed( true );', ';')
          must('newGame.SetVisibility( false );', 'newGame.SetVisibility( true );')
          # "Multiplayer" -> "Найти серверы" (to'g'ridan-to'g'ri server ro'yxati)
          s2 = re.sub(r'multiPlayer\.SetNameAndStatus\(\s*L\(\s*"GameUI_Multiplayer"\s*\)',
                      'multiPlayer.SetNameAndStatus( L( "GameUI_GameMenu_FindServers" )', s)
          print('multiplayer label ->', 'find servers' if s2 != s else 'NOT FOUND'); s = s2
          must('multiPlayer.onReleased = UI_MultiPlayer_Menu;', 'multiPlayer.onReleased = UI_InternetGames_Menu;')
          i = s.index('\tpreviews.SetCoord( hoffset, previews_voffset );')
          j = s.index("\t// now figure out what's visible")
          s = s[:i] + '''	bool single = gpGlobals->maxClients < 2;
          	int yoffset = previews_voffset + ygap;
          	quit.SetCoord( hoffset, yoffset ); yoffset -= ygap;
          	configuration.SetCoord( hoffset, yoffset ); yoffset -= ygap;
          	multiPlayer.SetCoord( hoffset, yoffset ); yoffset -= ygap;
          	newGame.SetCoord( hoffset, yoffset ); yoffset -= ygap * 2;
          	readme.SetCoord( hoffset, yoffset ); yoffset -= ygap * 2;
          	if( connected )
          	{
          		if( !single ) { disconnect.SetCoord( hoffset, yoffset ); yoffset -= ygap; }
          		resumeGame.SetCoord( hoffset, yoffset ); yoffset -= ygap;
          	}
          	console.SetCoord( hoffset, yoffset );

          ''' + s[j:]
          open(p, 'w', encoding='utf-8').write(s)
          print('Main.cpp patched')
          PY
      - name: Setup Java (JetBrains 21)
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'jetbrains'
          cache: gradle
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleGitDebug \
            -Porg.gradle.java.installations.paths="$JAVA_HOME" \
            -Porg.gradle.java.installations.auto-download=false
          mv app/build/outputs/apk/git/debug/app-git-debug.apk CS16-cssborka.apk
      - name: Sign APK (doimiy kalit)
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret yo'q"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > boosttop.jks
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks boosttop.jks --ks-key-alias boosttop \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out CS16-boosttop.apk CS16-cssborka.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs CS16-boosttop.apk | head -3
          rm -f boosttop.jks CS16-cssborka.apk
          echo "BUILD=${{ github.run_number }}" 
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CS16-boosttop-APK-build${{ github.run_number }}
          path: android/CS16-boosttop.apk
      - name: Release (APK zip'siz)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CS 1.6 boost-top - build ${{ github.run_number }}
          body: "Android APK (build ${{ github.run_number }}). mobile.json -> \"apk_build\": ${{ github.run_number }}"
          files: android/CS16-boosttop.apk
          make_latest: true
