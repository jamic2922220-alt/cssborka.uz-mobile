name: cssborka.uz Android APK (bitta APK, dvijok ichida)
on:
  push:
  workflow_dispatch:

jobs:
  # 1) Xash3D FWGS dvijogini rasmiy skriptlar bilan yig'ish
  engine:
    name: Xash3D dvijogi
    runs-on: ubuntu-latest
    env:
      SDL_VERSION: 2.32.10
      FFMPEG_VERSION: '9.0'
      GH_CPU_ARCH: multiarch
      GH_CPU_OS: android
    steps:
      - name: Checkout Xash3D FWGS
        uses: actions/checkout@v5
        with:
          repository: FWGS/xash3d-fwgs
          submodules: recursive
      - name: Install dependencies
        run: bash scripts/gha/deps_android.sh
      - name: Build engine
        run: bash scripts/gha/build_android.sh
      - name: Collect engine parts
        run: |
          mkdir -p out/java/su/xash/engine/util
          cp artifacts/xash3d-fwgs-android.apk out/engine.apk
          cp -r 3rdparty/SDL/android-project/app/src/main/java/org out/java/
          cp android/app/src/main/java/su/xash/engine/XashActivity.java out/java/su/xash/engine/
          cp android/app/src/main/java/su/xash/engine/util/SoftKeyboardPan.java out/java/su/xash/engine/util/
          ls -la out
      - name: Upload engine parts
        uses: actions/upload-artifact@v4
        with:
          name: engine-parts
          path: out/

  # 2) CS16Client + bosh ekran + dvijok = bitta APK
  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: engine
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Download engine parts
        uses: actions/download-artifact@v4
        with:
          name: engine-parts
          path: engine
      - name: Put engine inside the app
        run: |
          python3 - <<'PY'
          import os, re, shutil, zipfile
          app = 'android/app/src/main'
          z = zipfile.ZipFile('engine/engine.apk')
          skip = re.compile(r'(menu|client|server|hl|yapb|dlls|^libcs)', re.I)
          for n in z.namelist():
              if n.startswith('lib/') and n.endswith('.so'):
                  _, abi, name = n.split('/', 2)
                  if skip.search(name):
                      print('skip lib', abi, name); continue
                  dst = os.path.join(app, 'jniLibs', abi, name)
                  os.makedirs(os.path.dirname(dst), exist_ok=True)
                  open(dst, 'wb').write(z.read(n)); print('lib', abi, name)
              elif n.startswith('assets/') and not n.endswith('/'):
                  dst = os.path.join(app, 'engine_assets', n[len('assets/'):])
                  os.makedirs(os.path.dirname(dst), exist_ok=True)
                  open(dst, 'wb').write(z.read(n)); print('asset', n)
          # dvijokning Java qismi (SDL + XashActivity)
          shutil.copytree('engine/java', os.path.join(app, 'java'), dirs_exist_ok=True)
          p = os.path.join(app, 'java/su/xash/engine/XashActivity.java')
          s = open(p, encoding='utf-8').read()
          s = s.replace('import su.xash.engine.util.CrashReports;', '')
          s = s.replace('CrashReports.STACKTRACE_NAME', '"stacktrace.txt"')
          s = s.replace('CrashReports.writeSystemInfo(this);', '')
          s = re.sub(r'CrashReports\.writeIntentInfo\([^;]*\);', '', s)
          assert 'CrashReports' not in s, 'CrashReports qoldi'
          open(p, 'w', encoding='utf-8').write(s)

          # ilova build raqami (avtomatik yangilanish uchun)
          os.makedirs(os.path.join(app, 'engine_assets'), exist_ok=True)
          open(os.path.join(app, 'engine_assets', 'bt_build.txt'), 'w').write(os.environ.get('GITHUB_RUN_NUMBER', '0'))

          # touch tugmalari rasmlari, menyu fayllari, bot sozlamalari -> APK ichiga (binafsha kvadratlar bo'lmasin)
          ea = os.path.join(app, 'engine_assets')
          for src in ['3rdparty/cs16client-extras', '3rdparty/yapb/cfg']:
              shutil.copytree(src, ea, dirs_exist_ok=True); print('extras', src)
          # Ekrandagi ⚙ (touch_edit) tugmasi tugma muharririni emas, o'yin menyusini ochsin
          n_edit = 0
          for root, _, files in os.walk(ea):
              for fn in files:
                  if not fn.endswith('.cfg'): continue
                  fp = os.path.join(root, fn)
                  t = open(fp, encoding='utf-8', errors='replace').read()
                  t2 = re.sub(r'^(\s*touch_addbutton\s+"[^"]*edit[^"]*"\s+"[^"]*"\s+)"[^"]*"',
                              r'\1"togglemenu"', t, flags=re.M | re.I)
                  if t2 != t:
                      open(fp, 'w', encoding='utf-8').write(t2); n_edit += 1; print('touch_edit ->', fp)
          print('touch cfg patched:', n_edit)
          # CMake ham shu fayllarni src/main/assets ga ko'chiradi - takrorlanmasin, o'chiramiz
          p = 'CMakeLists.txt'
          s = open(p, encoding='utf-8').read()
          s2 = re.sub(r'file\(\s*REMOVE_RECURSE \$\{EXTRAS_OUTPUT\}\s*\)', '', s)
          s2 = re.sub(r'file\(\s*COPY \$\{EXTRAS_FILES\} \$\{YAPB_FILES\}\s*DESTINATION \$\{EXTRAS_OUTPUT\}\s*\)', '', s2)
          assert s2 != s, 'CMake extras copy topilmadi'
          open(p, 'w', encoding='utf-8').write(s2)

          # Bosh menyu: kompyuter versiyasidagidek (Hazard course, Load game, Readme, Previews, Custom game yo'q)
          p = '3rdparty/mainui_cpp/menus/Main.cpp'
          s = open(p, encoding='utf-8').read()
          for item in ['readme', 'previews', 'saveRestore', 'hazardCourse', 'customGame']:
              a = 'AddItem( %s );' % item
              assert a in s, a
              s = s.replace(a, ';')
          i = s.index('\tpreviews.SetCoord( hoffset, previews_voffset );')
          j = s.index("\t// now figure out what's visible")
          s = s[:i] + '''	bool single = gpGlobals->maxClients < 2;
          	int yoffset = previews_voffset + ygap;
          	quit.SetCoord( hoffset, yoffset ); yoffset -= ygap;
          	configuration.SetCoord( hoffset, yoffset ); yoffset -= ygap;
          	multiPlayer.SetCoord( hoffset, yoffset ); yoffset -= ygap;
          	newGame.SetCoord( hoffset, yoffset );
          	if( connected )
          	{
          		if( !single ) { disconnect.SetCoord( hoffset, yoffset ); yoffset -= ygap; }
          		resumeGame.SetCoord( hoffset, yoffset ); yoffset -= ygap;
          	}
          	console.SetCoord( hoffset, yoffset );

          ''' + s[j:]
          # "Multiplayer" o'rniga kompyuterdagidek "Найти серверы" - to'g'ridan-to'g'ri internet serverlar ro'yxati
          s2 = re.sub(r'multiPlayer\.SetNameAndStatus\(\s*L\(\s*"GameUI_Multiplayer"\s*\)',
                      'multiPlayer.SetNameAndStatus( L( "GameUI_GameMenu_FindServers" )', s)
          print('multiplayer label ->', 'find servers' if s2 != s else 'NOT FOUND'); s = s2
          open(p, 'w', encoding='utf-8').write(s)
          print('Main.cpp patched')
          PY
      - name: Setup Java (JetBrains 21)
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'jetbrains'
          cache: gradle
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleGitDebug \
            -Porg.gradle.java.installations.paths="$JAVA_HOME" \
            -Porg.gradle.java.installations.auto-download=false
          mv app/build/outputs/apk/git/debug/app-git-debug.apk CS16-cssborka.apk
      - name: Sign APK (doimiy kalit)
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret yo'q"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > boosttop.jks
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks boosttop.jks --ks-key-alias boosttop \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out CS16-boosttop.apk CS16-cssborka.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs CS16-boosttop.apk | head -3
          rm -f boosttop.jks CS16-cssborka.apk
          echo "BUILD=${{ github.run_number }}" 
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CS16-boosttop-APK-build${{ github.run_number }}
          path: android/CS16-boosttop.apk
      - name: Release (APK zip'siz)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CS 1.6 boost-top - build ${{ github.run_number }}
          body: "Android APK (build ${{ github.run_number }}). mobile.json -> \"apk_build\": ${{ github.run_number }}"
          files: android/CS16-boosttop.apk
          make_latest: true
